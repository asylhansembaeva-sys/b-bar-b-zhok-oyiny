<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1,maximum-scale=1,user-scalable=no"><title>Б бар ма, жоқ па?</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Segoe UI',Arial,sans-serif;overflow-x:hidden;color:#24405b;background:linear-gradient(180deg,#9dd7ff 0%,#a8dfff 42%,#d5f1ff 67%,#a8d875 68%,#79c64b 100%);min-height:100dvh;touch-action:pan-y}.world{min-height:100dvh;position:relative;overflow:hidden;isolation:isolate}.world:before{content:"";position:absolute;z-index:-1;left:-10%;width:120%;height:33%;bottom:-10%;border-radius:50% 50% 0 0;background:linear-gradient(#a7df7c,#73c347)}.hill{position:absolute;z-index:-2;bottom:16%;height:22%;width:65%;border-radius:60% 60% 0 0;background:#a2cfa1;opacity:.72}.hill.left{left:-20%}.hill.right{right:-22%;background:#9bd68b}.cloud{position:absolute;z-index:-1;width:170px;height:45px;background:#fff;border-radius:80px;opacity:.83;filter:blur(2px)}.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}.cloud:before{width:75px;height:75px;left:30px;bottom:10px}.cloud:after{width:90px;height:85px;right:17px;bottom:0}.c1{top:8%;left:4%}.c2{top:12%;right:5%;transform:scale(.8)}.c3{top:38%;left:40%;transform:scale(.55)}.sun{position:absolute;right:17%;top:3%;width:70px;height:70px;border-radius:50%;background:#ffe68b;box-shadow:0 0 45px #ffe88e;z-index:-2}.flowers{position:absolute;bottom:0%;width:100%;font-size:28px;letter-spacing:20px;white-space:nowrap;opacity:.8;pointer-events:none}.wrap{max-width:900px;margin:auto;padding:12px 14px 58px;position:relative}.header{background:#dff2ffdc;border:2px solid #ffffffab;border-radius:20px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;box-shadow:0 4px 15px #3774a32a}.header strong{font-size:clamp(20px,3.5vw,34px)}.small{font-size:12px;font-weight:700;color:#58768c}.score{background:white;border-radius:13px;padding:9px 14px;font-weight:800;white-space:nowrap}.instruction{text-align:center;font-weight:800;margin:18px 0 6px;font-size:clamp(17px,2.5vw,23px)}.baskets{display:flex;justify-content:space-evenly;align-items:flex-end;gap:16px;margin:15px auto 18px;max-width:820px}.basket{width:min(30vw,230px);height:clamp(140px,21vw,190px);border:0;background:transparent;position:relative;cursor:pointer;touch-action:manipulation;filter:drop-shadow(0 8px 5px #286b4030);transition:transform .15s}.basket:hover,.basket.selected{transform:translateY(-4px)}.handle,.bodybasket{display:none}.basket{background-position:center;background-repeat:no-repeat;background-size:contain}.basket[data-answer="false"]{background-image:url("basket_no.png")}.basket[data-answer="true"]{background-image:url("basket_yes.png")}.basket .tag{position:absolute;top:51%;left:18%;width:64%;height:26%;display:flex;align-items:center;justify-content:center;background:#f4dfad;border:2px solid #c79c5c;border-radius:9px;padding:0 2px;font-family:"Times New Roman",Times,serif;font-size:clamp(21px,3.1vw,33px);font-weight:900;color:#332316;white-space:nowrap;box-shadow:0 1px 3px #61451b55}.basket:focus-visible{outline:4px solid #ffce36;outline-offset:2px;border-radius:20px}.basket.ok{animation:yes .5s}.basket.no{animation:no .3s}@keyframes yes{50%{transform:scale(1.08)}}@keyframes no{25%,75%{transform:translateX(-9px)}50%{transform:translateX(9px)}}.card{width:min(235px,64vw);height:min(205px,53vw);min-height:165px;margin:5px auto;background:#fff;border:5px solid #3478c0;border-radius:25px;box-shadow:0 8px 20px #1c689a45;display:flex;align-items:center;justify-content:center;padding:8px;cursor:grab;touch-action:none;user-select:none;position:relative;transition:opacity .2s,transform .25s}.card img{width:100%;height:100%;object-fit:contain;pointer-events:none}.card.active{outline:5px solid #ffca46;outline-offset:4px}.card.fly{transform:scale(.1);opacity:0}.status{text-align:center;min-height:36px;margin:12px auto 5px;font-size:clamp(17px,2.6vw,24px);font-weight:900;color:#234d6c;text-shadow:0 1px #fff}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.btn{background:#fff;border:2px solid #7ab3e6;border-radius:14px;padding:10px 17px;font-size:17px;font-weight:800;color:#2b5b83;cursor:pointer}.btn:disabled{opacity:.4}.hint{text-align:center;font-size:13px;font-weight:700;color:#436f83;margin:9px auto}.end{background:#ffffffe8;border-radius:24px;text-align:center;padding:25px;margin:20px auto;max-width:450px;box-shadow:0 6px 20px #247ab044}.hidden{display:none!important}@media(max-width:540px){.wrap{padding:8px 8px 50px}.header{padding:8px}.score{padding:8px}.baskets{gap:4px;margin-top:0}.basket{width:46vw;height:145px}.basket .tag{top:51%;font-size:clamp(20px,5.4vw,27px)}.card{height:215px;width:235px;max-width:67vw}.flowers{font-size:19px;letter-spacing:8px}}
</style></head><body><div class="world"><div class="sun"></div><div class="hill left"></div><div class="hill right"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div><div class="flowers">🌸 🌼 🌸 🌼 🌷 🌸 🌼 🌸 🌷 🌼 🌸</div><main class="wrap"><div class="header"><div><div class="small">ТЫҢДА • АТА • АЖЫРАТ</div><strong>Б бар ма, жоқ па?</strong></div><div class="score">⭐ Ұпай: <span id="score">0</span>/10</div></div><div class="instruction">Суретті ата. Тиісті себетке сал!</div><div class="baskets"><button class="basket" data-answer="false" aria-label="Б жоқ"><span class="handle"></span><span class="bodybasket"></span><span class="tag">Б жоқ</span></button><button class="basket" data-answer="true" aria-label="Б бар"><span class="handle"></span><span class="bodybasket"></span><span class="tag">Б бар</span></button></div><div id="card" class="card" role="button" tabindex="0" aria-label="Суретті таңда"><img id="picture" src="01.webp" alt="Сурет"></div><div id="status" class="status" aria-live="polite">Суретті таңда немесе себетке сүйре!</div><div class="controls"><button class="btn" id="again">🔄 Қайта бастау</button><button class="btn" id="sound">🔊 Дыбыс: қосулы</button></div><div class="hint">Сүйреп сал немесе суретті, содан кейін себетті бас.</div><section id="end" class="end hidden"><h1>🎉 ЖАРАЙСЫҢ!</h1><p>Барлық 10 суретті дұрыс ажыраттың!</p><button class="btn" id="restart">Тағы ойнау</button></section></main></div><script>
const words=[['балға',true],['бұзау',true],['қарбыз',true],['сабын',true],['балық',true],['домбыра',true],['құс',false],['тас',false],['лақ',false],['доп',false]];
const card=document.getElementById('card'),picture=document.getElementById('picture'),status=document.getElementById('status'),score=document.getElementById('score'),baskets=[...document.querySelectorAll('.basket')];let order=[],pos=0,locked=false,selected=false,sound=true,drag=null,suppressClick=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let audioCtx;function tone(freq,start,duration,type='sine',volume=.12){if(!sound)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime+start;o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(volume,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+duration);o.connect(g).connect(audioCtx.destination);o.start(t);o.stop(t+duration+.02)}catch(e){}}function playSound(correct){if(correct){tone(660,0,.15);tone(880,.14,.24)}else{tone(210,0,.17,'triangle',.10);tone(165,.16,.22,'triangle',.10)}}
function start(){const yes=shuffle([0,1,2,3,4,5]),no=shuffle([6,7,8,9]);order=[];for(let k=0;k<4;k++){order.push(yes[k],no[k])}order.push(yes[4],yes[5]);pos=0;locked=false;selected=false;score.textContent='0';document.getElementById('end').classList.add('hidden');card.classList.remove('hidden','fly');card.style.transform='';show()}
function show(){locked=false;selected=false;card.classList.remove('active','fly');let i=order[pos];picture.src=String(i+1).padStart(2,'0')+'.webp';picture.alt='Сөзді ата';status.textContent='Суретті таңда немесе себетке сүйре!';}
function choose(answer,basket){if(locked)return;let correct=words[order[pos]][1];if(answer!==correct){basket.classList.remove('no');void basket.offsetWidth;basket.classList.add('no');status.textContent='Қайта ойланып көр!';playSound(false);return}locked=true;basket.classList.add('ok');card.classList.add('fly');status.textContent='🌟 ЖАРАЙСЫҢ!';score.textContent=pos+1;playSound(true);setTimeout(()=>{basket.classList.remove('ok');pos++;if(pos>=order.length){card.classList.add('hidden');document.getElementById('end').classList.remove('hidden');status.textContent='Тамаша! Барлық тапсырма орындалды!'}else show()},850)}
baskets.forEach(b=>b.addEventListener('click',()=>choose(b.dataset.answer==='true',b)));
card.addEventListener('click',()=>{if(suppressClick){suppressClick=false;return}if(locked)return;selected=!selected;card.classList.toggle('active',selected);status.textContent=selected?'Енді тиісті себетті бас!':'Суретті таңда немесе себетке сүйре!'});
card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();card.click()}});
card.addEventListener('pointerdown',e=>{if(locked)return;drag={x:e.clientX,y:e.clientY,moved:false};card.setPointerCapture(e.pointerId)});
card.addEventListener('pointermove',e=>{if(!drag)return;if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>15)drag.moved=true;if(drag.moved){card.style.transform=`translate(${e.clientX-drag.x}px,${e.clientY-drag.y}px) scale(.94)`;card.style.zIndex='20'}});
card.addEventListener('pointerup',e=>{if(!drag)return;let moved=drag.moved;drag=null;card.style.transform='';card.style.zIndex='';if(moved){suppressClick=true;setTimeout(()=>suppressClick=false,100);let b=baskets.find(b=>{let r=b.getBoundingClientRect();return e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom});if(b)choose(b.dataset.answer==='true',b)}});
card.addEventListener('pointercancel',()=>{drag=null;card.style.transform='';card.style.zIndex=''})
document.getElementById('again').onclick=start;document.getElementById('restart').onclick=start;document.getElementById('sound').onclick=()=>{sound=!sound;document.getElementById('sound').textContent=sound?'🔊 Дыбыс: қосулы':'🔇 Дыбыс: өшірулі'};start();
</script></body></html>
